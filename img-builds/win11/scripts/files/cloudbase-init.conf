[DEFAULT]
username=Administrator
groups=Administrators
inject_user_password=true
config_drive_raw_hhd=true
config_drive_cdrom=true
config_drive_vfat=true
bsdtar_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\bsdtar.exe
mtools_path=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\bin\
verbose=true
debug=true
logdir=C:\Program Files\Cloudbase Solutions\Cloudbase-Init\log\
logfile=cloudbase-init.log
; Proxmox generates the cloud-init drive in OpenStack configdrive2 format
; (label "config-2") for VMs with a win* ostype, not NoCloud ("cidata"), so
; ConfigDriveService is the one that actually fires on terraform clones.
; NoCloud is kept first for cidata-style drives (e.g. hand-made seeds).
metadata_services=cloudbaseinit.metadata.services.nocloudservice.NoCloudConfigDriveService,cloudbaseinit.metadata.services.configdrive.ConfigDriveService
plugins=cloudbaseinit.plugins.common.mtu.MTUPlugin,cloudbaseinit.plugins.common.sethostname.SetHostNamePlugin,cloudbaseinit.plugins.windows.extendvolumes.ExtendVolumesPlugin,cloudbaseinit.plugins.common.userdata.UserDataPlugin
; allow_reboot lets SetHostNamePlugin reboot BEFORE UserDataPlugin runs, so
; the NetBird join in the user-data registers under the final hostname (peer
; names are fixed at registration and do not follow later renames).
allow_reboot=true
stop_service_on_exit=false
