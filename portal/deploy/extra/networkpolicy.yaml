# Default deny; allow ingress from Traefik, egress to DNS, Postgres in-namespace,
# OpenBao (for ESO, which runs elsewhere, nothing needed here) and HTTPS out
# (Authentik discovery/token calls), plus the Proxmox API on each cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
  egress:
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: [{ podSelector: {} }]
    - ports: [{ port: 443, protocol: TCP }]
    # Proxmox VE API and console websockets. Narrow `to` to your nodes' addresses.
    - ports: [{ port: 8006, protocol: TCP }]
