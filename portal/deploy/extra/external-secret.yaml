# Secrets from OpenBao apps/macs (kv v2). Create these keys there first:
#   DATABASE_URL, BETTER_AUTH_SECRET, AUTHENTIK_CLIENT_ID, AUTHENTIK_CLIENT_SECRET, SERVICE_KEYS,
#   and one Proxmox API token secret per cluster as named in config.yaml
#   (e.g. RESEARCH_PVE_TOKEN, HOMELAB_PVE_TOKEN)
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc.cluster.local:8200
      path: apps
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: macs
          serviceAccountRef: { name: macs-eso }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: macs-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: macs-secrets
spec:
  secretStoreRef: { name: openbao, kind: SecretStore }
  target: { name: macs-secrets }
  refreshInterval: 1h
  dataFrom:
    - extract: { key: macs }
