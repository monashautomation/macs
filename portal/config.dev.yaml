# Local development: in-memory "Proxmox" clusters (driver: mock). See README.
clusters:
  - id: research
    name: Research cluster
    kind: research
    description: 5 nodes on Ceph with RTX 4090s. Requests are reviewed by Systems & Infra.
    driver: mock
    allowed_groups: [automation-members]
    approval: required
    storage: ceph-vm
    shared_storage: true
    backup_storage: pbs
    connect_domain: netbird.selfhosted
    iso_storage: cephfs
    network:
      label: Labs network
      description: VMs sit directly on the labs LAN and can reach lab equipment and each other.
    limits: { max_cores: 32, max_memory_mb: 131072, max_disk_gb: 500 }
    templates:
      - id: golden-jam
        name: Ubuntu desktop (golden-jam)
        vmid: 9000
        default_user: baker
        description: Ubuntu 22.04 desktop with NVIDIA drivers, CUDA, PyTorch, ROS 2 and Sunshine streaming baked in.
        gpu_ready: true
        tags: [desktop, cuda, ros2]
        connect: [ssh, sunshine]
      - id: win11
        name: Windows 11
        vmid: 9001
        os: windows
        description: Windows 11 with NVIDIA drivers, Sunshine and RDP enabled.
        gpu_ready: true
        tags: [desktop]
        connect: [rdp, sunshine]
      - {
          id: ubuntu-server,
          name: Ubuntu 24.04 server,
          vmid: 9002,
          default_user: ubuntu,
          tags: [minimal],
          description: Plain cloud image for CPU-only services.,
        }
    gpu:
      mapping: rtx4090
      devices:
        - { id: gpu-1, node: pve1, model: RTX 4090 }
        - { id: gpu-2, node: pve2, model: RTX 4090 }
        - { id: gpu-3, node: pve3, model: RTX 4090 }
        - { id: gpu-4, node: pve4, model: RTX 4090 }
        - { id: gpu-5, node: pve5, model: RTX 4090 }

  - id: homelab
    name: Homelab
    kind: homelab
    description: Self-service VMs for learning and tinkering.
    driver: mock
    approval: none
    storage: local-lvm
    connect_domain: netbird.selfhosted
    iso_storage: local
    setups: true # offer the ready-made setup library (one-click installs)
    labs: true # offer multi-VM labs (VMs deployed together that can reach each other)
    lifetime_days: 30 # VMs are shut down (never deleted) after this unless extended; 0 = never
    expiry_warning_days: 3
    max_snapshots: 3 # per VM; 0 = off
    # default_image: ubuntu                # image setups install on; default: first Ubuntu/Debian template
    network:
      label: Homelab network
      description: VMs are isolated from each other. Reach yours over NetBird, and publish ports to share a service.
      isolate: true
      access_ports: [22]
      access_sources: [100.64.0.0/10] # NetBird range
      services: true
      public_sources: [100.64.0.0/10]
    limits: { max_cores: 4, max_memory_mb: 8192, max_disk_gb: 80 }
    quota: { max_vms: 3, max_cores: 8, max_memory_mb: 16384, max_disk_gb: 160 }
    templates:
      - {
          id: ubuntu,
          name: Ubuntu 24.04 server,
          vmid: 9000,
          default_user: ubuntu,
          tags: [minimal],
          description: "Cloud image: boots in seconds with your SSH key.",
        }
      - { id: debian, name: Debian 12, vmid: 9001, default_user: debian, tags: [minimal] }
      - {
          id: nixos-iso,
          name: NixOS 24.11 installer,
          kind: iso,
          os: other,
          volid: "local:iso/nixos-minimal-24.11-x86_64-linux.iso",
          description: Install NixOS yourself from the console.,
        }
